{% extends "tasks/base.html" %}

{% block title %}Registra't · ToDo{% endblock %}

{% block content %}
<div class="auth-card">
  <h1>Crea el teu compte</h1>

  {% if form.non_field_errors %}
    <p class="form-error">{{ form.non_field_errors.first }}</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Registrar-me</button>
  </form>

  <p class="auth-switch">Ja tens compte? <a href="{% url 'login' %}">Inicia la sessió</a></p>
</div>
{% endblock %}
